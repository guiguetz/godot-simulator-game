name: Sync wiki

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Publica docs/ no wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout wiki
        run: |
          git clone "https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
        shell: bash

      - name: Gera páginas a partir de docs/
        run: |
          python3 tools/wiki_sync.py . wiki \
            --commit "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --branch main
        shell: bash

      - name: Commit e push no wiki
        run: |
          cd wiki
          git config user.name "wiki-sync-bot"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki sem mudanças."
            exit 0
          fi
          git commit -m "sync: publica docs/ de ${GITHUB_SHA::7}"
          git push
        shell: bash

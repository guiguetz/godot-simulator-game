name: Sync wiki

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

jobs:
  sync-wiki:
    name: Publica docs/ no wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout wiki
        run: |
          git clone "https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
        shell: bash

      - name: Copia docs/ para o wiki
        run: |
          # Remove .md antigos gerados (mantém .git)
          find wiki -maxdepth 1 -name "*.md" -delete
          # Home = docs/README.md; demais arquivos viram páginas próprias
          for f in docs/*.md docs/adr/*.md; do
            base="$(basename "$f")"
            if [ "$base" = "README.md" ] && [ "$(dirname "$f")" = "docs" ]; then
              dest="Home.md"                # docs/README.md -> Home
            elif [ "$(dirname "$f")" = "docs/adr" ]; then
              if [ "$base" = "README.md" ]; then
                dest="ADR-Home.md"          # índice dos ADRs
              else
                dest="ADR-${base^}"         # ex.: 001-versao-do-godot.md -> ADR-001-versao-do-godot.md
              fi
            else
              dest="${base^}"               # github-projects.md -> Github-projects.md
            fi
            {
              echo "<!-- Gerado a partir de docs/ no commit ${GITHUB_SHA} — não editar aqui; edite em docs/ e deixe o workflow publicar. -->"
              echo
              cat "$f"
            } > "wiki/$dest"
          done
          rm -f wiki/Home.md.bak
          if [ ! -f wiki/Home.md ]; then echo "docs/README.md ausente" > wiki/Home.md; fi
        shell: bash

      - name: Commit e push no wiki
        run: |
          cd wiki
          git config user.name "wiki-sync-bot"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki sem mudanças."
            exit 0
          fi
          git commit -m "sync: publica docs/ de ${GITHUB_SHA::7}"
          git push
        shell: bash

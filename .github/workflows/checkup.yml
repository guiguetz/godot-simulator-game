name: Checkup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checkup:
    name: Consistência (planos, issues, labels, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnóstico do token
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "--- tipo/escopos do token (sem expor o valor) ---"
          gh api -i user 2>/dev/null | grep -iE 'x-oauth-scopes|x-accepted-oauth-scopes|x-accepted-github-permissions' \
            || echo "(nenhum header de escopo — provável fine-grained PAT)"
          echo "--- conta do token ---"
          gh api user -q .login 2>&1 || true
          echo "--- graphql: projectV2 de guiguetz ---"
          gh api graphql -f query='{ user(login:"guiguetz"){ projectV2(number:1){ id title } } }' 2>&1 | head -c 300 || true
          echo
          echo "--- gh --version ---"
          gh --version 2>&1 | head -1 || true
          echo "--- gh project view --owner @me ---"
          gh project view 1 --owner @me 2>&1 | head -3 || true
          echo "--- gh project view ---"
          gh project view 1 --owner guiguetz 2>&1 | head -5 || true

      - name: Checkup
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ secrets.PROJECTS_TOKEN }}" ]; then
            echo "PROJECTS_TOKEN presente — checagens de board habilitadas"
            args=""
          else
            echo "PROJECTS_TOKEN ausente — checagens de board puladas (--no-board)"
            args="--no-board"
          fi
          python3 .agents/skills/checkup/scripts/checkup.py $args --no-smoke
